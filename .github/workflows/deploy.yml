# Publishes the game to GitHub Pages (https://ohfrinzx.github.io/Reign-Check/)
# on every push to the default branch — i.e. every verified merge goes live.
# The unit tests run first: if one fails, nothing is published.
# See docs/MOBILE_AND_HOSTING.md. Action versions were checked against each
# action's git tags and release notes on 2026-09-23.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/confident-meitner-lc0bgc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One deploy at a time; a newer push cancels an older one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
